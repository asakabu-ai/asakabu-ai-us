<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>朝株AI US Premium</title>

<style>

body{
background:#111;
color:white;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
margin:0;
padding:20px;
}

.card{
background:#1f1f1f;
border-radius:22px;
padding:24px;
margin-bottom:24px;
border:1px solid #2d2d2d;
box-shadow:0 6px 20px rgba(0,0,0,.25);
}

h1{
margin-top:0;
font-size:34px;
}

h2{
font-size:30px;
margin-bottom:8px;
}

.price{
font-size:24px;
font-weight:bold;
margin-top:20px;
margin-bottom:20px;
}

.rank{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 0;
border-bottom:1px solid #2d2d2d;
font-size:24px;
}

.rank:last-child{
border-bottom:none;
}

.plus{
color:#2ecc71;
font-weight:bold;
}

.comment{
text-align:center;
color:#bfbfbf;
font-size:18px;
margin-top:25px;
line-height:1.8;
}

</style>

</head>

<body>

<div class="card">

<h1>👑 プレミアム</h1>

<div class="price">

📊 セクターランキング
</div>
<div class="rank">
<span>🥇 半導体</span>
<span class="plus">+2.35%</span>
</div>

<div class="rank">
<span>🥈 ソフトウェア</span>
<span class="plus">+1.82%</span>
</div>

<div class="rank">
<span>🥉 AI関連</span>
<span class="plus">+1.47%</span>
</div>

<div class="comment">
本日最も資金が流入しているセクターです。<br>
市場の強さを確認してから銘柄を選びましょう。
</div>
<div class="card">

<h2>⭐ 今日の注目銘柄5選</h2>

</div>  
</div>

</body>
</html>
